- include_tasks: update-status-progress.yml
  vars:
    status_progress_message: "Creating core resources"

# The ServiceAccount, ClusterRole and ClusterRoleBinding give the OSSMC pod read access to the cluster TLS profile
# (get on apiservers/cluster). They are created before the ConfigMaps and the Deployment so the pod has its identity
# and permissions when it starts. The ConfigMaps come before the Deployment so a new pod never mounts an old nginx.conf.
# The cluster-scoped resources are removed explicitly by playbooks/ossmconsole-remove.yml.
- name: Create OSSM Console objects on OpenShift
  include_tasks: process-resource.yml
  vars:
    process_resource_templates:
    - "templates/openshift/serviceaccount.yaml"
    - "templates/openshift/clusterrole.yaml"
    - "templates/openshift/clusterrolebinding.yaml"
    - "templates/openshift/configmap-nginx.yaml"
    - "templates/openshift/configmap-plugin.yaml"
    - "templates/openshift/deployment.yaml"
    - "templates/openshift/service.yaml"
    - "templates/openshift/consoleplugin.yaml"
