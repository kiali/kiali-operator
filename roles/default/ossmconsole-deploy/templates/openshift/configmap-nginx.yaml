apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-conf
  namespace: "{{ ossmconsole_vars.deployment.namespace }}"
  labels: {{ ossmconsole_resource_metadata_labels }}
data:
  nginx.conf: |
    error_log /dev/stdout;
    events {}
    http {
      access_log         /dev/stdout;
      include            /etc/nginx/mime.types;
      default_type       application/octet-stream;
      keepalive_timeout  65;
      server {
        listen              9443 ssl;
        listen              [::]:9443 ssl;
        ssl_certificate     /var/serving-cert/tls.crt;
        ssl_certificate_key /var/serving-cert/tls.key;
        # TLS settings from cluster APIServer spec.tlsSecurityProfile (OpenShift TLS adherence)
        ssl_protocols       {{ ossmconsole_nginx_tls.ssl_protocols }};
{% if ossmconsole_nginx_tls.ssl_ciphers | length > 0 %}
        ssl_ciphers         {{ ossmconsole_nginx_tls.ssl_ciphers }};
{% endif %}
{% if ossmconsole_nginx_tls.ssl_ciphersuites_line | length > 0 %}
        {{ ossmconsole_nginx_tls.ssl_ciphersuites_line }}
{% endif %}
        ssl_ecdh_curve      {{ ossmconsole_nginx_tls.ssl_ecdh_curve }};

        add_header oauth_token "$http_Authorization";

        location / {
          root                /usr/share/nginx/html;
        }
      }
    }
