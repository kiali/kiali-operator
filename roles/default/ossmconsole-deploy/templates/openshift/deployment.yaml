apiVersion: apps/v1
kind: Deployment
metadata:
  name: ossmconsole
  namespace: "{{ ossmconsole_vars.deployment.namespace }}"
  labels: {{ ossmconsole_resource_metadata_labels }}
spec:
  # Scaled to zero when the cluster TLS profile is definitively invalid
  # (see tasks/openshift/tls-profile.yml). Rendered unquoted with an int cast:
  # the API rejects a string for this int32 field.
  replicas: {{ ossmconsole_replicas | default(1) | int }}
  selector:
    matchLabels:
      app.kubernetes.io/name: ossmconsole
      app.kubernetes.io/instance: ossmconsole
  template:
    metadata:
      name: ossmconsole
      labels: {{ ossmconsole_resource_metadata_labels }}
      annotations:
        ossmconsole.kiali.io/last-updated: "{{ deployment_last_updated }}"
    spec:
{% if ossmconsole_vars.deployment.imagePullSecrets | default([]) | length > 0 %}
      imagePullSecrets:
{% for n in ossmconsole_vars.deployment.imagePullSecrets %}
      - name: {{ n }}
{% endfor %}
{% endif %}
      containers:
      - name: ossmconsole
        image: {{ ossmconsole_vars.deployment.imageName }}{{ '@' + ossmconsole_vars.deployment.imageDigest if ossmconsole_vars.deployment.imageDigest != '' else '' }}:{{ ossmconsole_vars.deployment.imageVersion }}
        imagePullPolicy: {{ ossmconsole_vars.deployment.imagePullPolicy }}
        ports:
        - containerPort: 9443
          protocol: TCP
        # The kubelet performs a real TLS handshake, so a config that cannot
        # complete one (bad groups, ECDSA-only ciphers with an RSA certificate)
        # leaves the pod Unready instead of serving broken TLS.
        readinessProbe:
          httpGet:
            scheme: HTTPS
            path: /plugin-manifest.json
            port: 9443
          periodSeconds: 10
          timeoutSeconds: 3
        securityContext:
          allowPrivilegeEscalation: false
          privileged: false
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: ossmconsole-cert-secret
          readOnly: true
          mountPath: /var/serving-cert
        - name: nginx-conf
          readOnly: true
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
        - name: plugin-conf
          readOnly: true
          mountPath: /usr/share/nginx/html/plugin-config.json
          subPath: plugin-config.json
      volumes:
      - name: ossmconsole-cert-secret
        secret:
          secretName: ossmconsole-cert-secret
          defaultMode: 420
      - name: nginx-conf
        configMap:
          name: nginx-conf
          defaultMode: 420
      - name: plugin-conf
        configMap:
          name: plugin-conf
          defaultMode: 420
      restartPolicy: Always
      dnsPolicy: ClusterFirst
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: "25%"
      maxSurge: "25%"
