apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-conf
  namespace: "{{ ossmconsole_vars.deployment.namespace }}"
  labels: {{ ossmconsole_resource_metadata_labels }}
data:
  nginx.conf: |
    error_log /dev/stdout;
    events {}
    http {
      access_log         /dev/stdout;
      include            /etc/nginx/mime.types;
      default_type       application/octet-stream;
      keepalive_timeout  65;
      server {
        listen              9443 ssl;
        listen              [::]:9443 ssl;
        ssl_certificate     /var/serving-cert/tls.crt;
        ssl_certificate_key /var/serving-cert/tls.key;
        # TLS directives resolved from the cluster TLS security profile (APIServer/cluster).
        # The operator re-renders this ConfigMap and restarts the pod when the profile changes.
{% for directive in ossmconsole_tls.directives %}
        {{ directive }}
{% endfor %}

        add_header oauth_token "$http_Authorization";

        location / {
          root                /usr/share/nginx/html;
        }
      }
    }
