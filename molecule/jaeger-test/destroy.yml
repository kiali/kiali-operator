---
- import_playbook: ../default/destroy.yml

- name: Destroy jaeger-test scenario resources
  hosts: localhost
  connection: local
  collections:
  - kubernetes.core
  tasks:
  - name: Remove external Jaeger NodePort service
    k8s:
      state: absent
      api_version: v1
      kind: Service
      name: jaeger-query-external
      namespace: istio-system
    ignore_errors: yes

  - name: Remove external Jaeger Route (OpenShift)
    k8s:
      state: absent
      api_version: route.openshift.io/v1
      kind: Route
      name: jaeger-query-external
      namespace: istio-system
    ignore_errors: yes
