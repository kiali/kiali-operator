apiVersion: kiali.io/v1alpha1
kind: Kiali
metadata:
  name: kiali
spec:
  version: {{ kiali.spec_version }}
  auth:
    strategy: {{ kiali.auth_strategy }}
  deployment:
    ingress:
      enabled: false
    logger:
      log_level: debug
    namespace: {{ kiali.install_namespace }}
    image_name: "{{ kiali.image_name }}"
    image_pull_policy: {{ kiali.image_pull_policy }}
    image_version: "{{ kiali.image_version }}"
    cluster_wide_access: {{ kiali.cluster_wide_access|bool }}
{% if kiali.discovery_selectors %}
    discovery_selectors:
      default: {{ kiali.discovery_selectors }}
      # An override for a cluster this environment never connects. The operator cannot
      # know which clusters are in the mesh - it validates only the override's form and
      # creates no roles from it. The server consults an override only for a cluster it
      # actually knows (one with a remote cluster secret), so this entry is inert here
      # at runtime. The selectors are name-form so they pass the non-CWA validation.
      overrides:
        cluster-that-is-not-in-the-mesh:
        - matchLabels:
            kubernetes.io/metadata.name: istio-system
{% endif%}
    probes:
      liveness:
        initial_delay_seconds: 1
        period_seconds: 1
      readiness:
        initial_delay_seconds: 1
        period_seconds: 1
      startup:
        failure_threshold: 60
        initial_delay_seconds: 1
        period_seconds: 1
    service_type: {{ 'LoadBalancer' if is_kind else 'NodePort' }}
  server:
    web_root: {{ kiali.server_web_root }}
